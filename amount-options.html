<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Amount entry options</title>
<style>
  :root { --a: #ff7a45; --a2: #ffc46b; --hot: #ff4d4d; --line: rgba(255,255,255,.13); --card: rgba(255,255,255,.06); --mute: rgba(255,255,255,.55); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: radial-gradient(120% 60% at 80% -10%, #4a1d0f, #140a07 60%) #140a07; color: #fff; font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; -webkit-user-select: none; user-select: none; padding: 20px 16px 80px; }
  h1 { font-size: 22px; margin: 6px 0 4px; } .lead { color: var(--mute); font-size: 14px; line-height: 1.5; margin: 0 0 22px; max-width: 560px; }
  .wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); }
  .opt { background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: 16px; min-width: 0; }
  .head { display: flex; gap: 12px; align-items: center; }
  .letter { width: 38px; height: 38px; border-radius: 13px; background: var(--a); color: #1a0a03; font-weight: 900; display: grid; place-items: center; font-size: 18px; flex: none; }
  .head h2 { margin: 0; font-size: 17px; } .head p { margin: 2px 0 0; font-size: 12.5px; color: var(--mute); line-height: 1.35; }
  .amtbar { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; }
  .amt { font-size: 40px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; transition: color .2s, text-shadow .2s; }
  .amt.hot { color: var(--hot); text-shadow: 0 0 22px rgba(255,77,77,.6); }
  .tag { font-size: 11px; font-weight: 800; background: var(--hot); color: #fff; padding: 4px 9px; border-radius: 99px; opacity: 0; transform: scale(.7); transition: .25s cubic-bezier(.3,1.7,.5,1); }
  .tag.on { opacity: 1; transform: scale(1); }
  .sp { flex: 1; }
  .clr { font: inherit; font-size: 12px; font-weight: 700; color: var(--mute); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 7px 12px; cursor: pointer; }
  .stage { position: relative; display: grid; place-items: center; min-height: 250px; touch-action: none; }
  .hint { font-size: 12px; color: var(--mute); text-align: center; margin-top: 6px; }
  .shake { animation: shake .45s; } @keyframes shake { 20% { transform: translateX(-9px) } 40% { transform: translateX(9px) } 60% { transform: translateX(-5px) } 80% { transform: translateX(5px) } }
  .chips { display: flex; gap: 6px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: #fff; cursor: pointer; }
  .chip.on { background: var(--a); color: #1a0a03; border-color: transparent; }

  /* A knob */
  .knob { position: relative; width: 240px; height: 240px; touch-action: none; cursor: grab; }
  .knob svg { display: block; }
  .kcenter { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .kcenter b { font-size: 34px; color: var(--a); display: block; } .kcenter small { color: var(--mute); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  /* B tape */
  canvas.tape { width: 100%; height: 130px; display: block; touch-action: none; cursor: ew-resize; border-radius: 18px; background: rgba(0,0,0,.3); border: 1px solid var(--line); }
  .needle { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--a); border-radius: 2px; pointer-events: none; box-shadow: 0 0 14px var(--a); }
  /* C spiral */
  .spiralwrap { position: relative; width: 280px; height: 280px; touch-action: none; cursor: grab; }
  /* D jar */
  .jar { position: relative; width: 170px; height: 210px; border: 3px solid rgba(255,255,255,.35); border-radius: 18px 18px 46px 46px; overflow: hidden; background: rgba(255,255,255,.04); touch-action: none; cursor: pointer; }
  .jar .fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #ffd45e, #ff9a3c); height: 0; transition: height .15s; }
  .jar .lab { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.5); pointer-events: none; text-align: center; }
  .coin { position: absolute; top: -20px; width: 18px; height: 18px; border-radius: 50%; background: #ffd34d; border: 2px solid #e09a1c; animation: fall .7s ease-in forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(210px) rotate(360deg); opacity: .9 } }
  /* E notes */
  .notes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
  .note { font: inherit; border: 0; border-radius: 10px; aspect-ratio: 2/1.15; color: #101010; font-weight: 900; font-size: 18px; position: relative; cursor: pointer; box-shadow: inset 0 0 0 3px rgba(255,255,255,.35), 0 3px 0 rgba(0,0,0,.35); transition: transform .08s; touch-action: manipulation; }
  .note:active { transform: translateY(3px) scale(.96); }
  .pile { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; min-height: 34px; justify-content: center; width: 100%; }
  .pile .chip { padding: 6px 10px; }
  /* F slider */
  .scrub { position: relative; width: 100%; height: 74px; border-radius: 24px; background: rgba(0,0,0,.3); border: 1px solid var(--line); touch-action: none; cursor: ew-resize; overflow: hidden; }
  .scrub .bar { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, rgba(255,122,69,.15), rgba(255,122,69,.55)); }
  .scrub .thumb { position: absolute; top: 8px; bottom: 8px; width: 12px; margin-left: -6px; border-radius: 8px; background: #fff; box-shadow: 0 0 16px var(--a); }
  .scrub .ticks { position: absolute; inset: auto 0 6px 0; display: flex; justify-content: space-between; padding: 0 14px; font-size: 10px; color: var(--mute); pointer-events: none; }
  .fine { font-size: 12px; font-weight: 800; color: var(--a); height: 16px; }
</style>
</head>
<body>
<h1>Amount entry — pick one</h1>
<p class="lead">Six ways to enter an amount, all working. Try each one with your thumb (open this on your phone for the real feel). Every card also shows the red “big spend” reaction at ₹1,000+. Tell me the letter you want and I’ll build it into Pulse.</p>
<div class="wrap" id="wrap"></div>

<script>
const MAX = 99999;
const fmt = (n) => '₹' + n.toLocaleString('en-IN');
const buzz = (m = 5) => { try { navigator.vibrate && navigator.vibrate(m) } catch (e) {} };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapA = (d) => ((((d + 180) % 360) + 360) % 360) - 180;

/* card shell: returns { stage, hintEl, set(v), get() } */
function card(letter, title, how, hint) {
  const el = document.createElement('section');
  el.className = 'opt';
  el.innerHTML = `<div class="head"><div class="letter">${letter}</div><div><h2>${title}</h2><p>${how}</p></div></div>
    <div class="amtbar"><div class="amt">₹0</div><div class="tag"></div><div class="sp"></div><button class="clr">Clear</button></div>
    <div class="stage"></div><div class="hint">${hint}</div>`;
  document.getElementById('wrap').appendChild(el);
  const amtEl = el.querySelector('.amt'), tag = el.querySelector('.tag');
  let v = 0, tier = 0, onClear = () => {};
  const api = {
    stage: el.querySelector('.stage'), el,
    get: () => v,
    set(n) {
      v = clamp(Math.round(n), 0, MAX);
      amtEl.textContent = fmt(v);
      const t = v >= 10000 ? 3 : v >= 5000 ? 2 : v >= 1000 ? 1 : 0;
      amtEl.classList.toggle('hot', t > 0);
      tag.textContent = ['', 'Heavy one.', 'Whoa — that hurt.', 'Legendary spend.'][t];
      tag.classList.toggle('on', t > 0);
      if (t > tier) { buzz([30, 40, 60]); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
      tier = t;
    },
    onClear(fn) { onClear = fn },
  };
  el.querySelector('.clr').onclick = () => { api.set(0); onClear(); };
  return api;
}

/* ---------- A: spin knob (click wheel) ---------- */
(function () {
  const c = card('A', 'Spin knob', 'One big knob. Spin clockwise to add, anticlockwise to subtract. Spin slowly for ₹1 steps, faster for ₹10, ₹50, ₹100.', 'Slow = ±1 · medium = ±10 · fast = ±50 · very fast = ±100');
  const ticks = Array.from({ length: 36 }, (_, i) => `<line x1="0" y1="-100" x2="0" y2="${i % 3 ? -92 : -86}" stroke="${i === 0 ? 'var(--a)' : 'rgba(255,255,255,.5)'}" stroke-width="${i === 0 ? 4 : 2}" stroke-linecap="round" transform="rotate(${i * 10})"/>`).join('');
  c.stage.innerHTML = `<div class="knob"><svg viewBox="-110 -110 220 220" width="240" height="240"><circle r="108" fill="rgba(0,0,0,.3)" stroke="var(--line)"/><g class="rot" style="transform-box:fill-box;transform-origin:center">${ticks}</g><circle r="66" fill="#1d120d" stroke="var(--a)" stroke-opacity=".5" stroke-width="2"/></svg><div class="kcenter"><div><b>+1</b><small>spin me</small></div></div></div>`;
  const k = c.stage.querySelector('.knob'), rot = k.querySelector('.rot'), stepEl = k.querySelector('b');
  let last = null, lt = 0, acc = 0, rotDeg = 0, ema = 0;
  const pol = (e) => { const r = k.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI; };
  k.onpointerdown = (e) => { k.setPointerCapture(e.pointerId); last = pol(e); lt = performance.now(); };
  k.onpointermove = (e) => {
    if (last === null) return;
    const a = pol(e), d = wrapA(a - last), now = performance.now(), dt = Math.max(1, now - lt);
    last = a; lt = now; rotDeg += d; rot.style.transform = `rotate(${rotDeg}deg)`;
    ema = ema * 0.7 + (Math.abs(d) / dt) * 0.3;
    const step = ema < 0.2 ? 1 : ema < 0.6 ? 10 : ema < 1.4 ? 50 : 100;
    stepEl.textContent = (d < 0 ? '−' : '+') + step;
    acc += d / 12;
    while (Math.abs(acc) >= 1) { const s = Math.sign(acc); acc -= s; c.set(c.get() + s * step); buzz(3); }
  };
  k.onpointerup = k.onpointercancel = () => { last = null; ema = 0; acc = 0; stepEl.textContent = '+1'; };
})();

/* ---------- B: tape ruler ---------- */
(function () {
  const c = card('B', 'Tape ruler', 'Drag a measuring tape under the needle. Fling it for momentum. Pick how much each tick is worth.', 'Drag left to add · right to subtract · chips change the tick size');
  c.stage.style.minHeight = '170px';
  c.stage.innerHTML = `<div style="position:relative;width:100%"><canvas class="tape"></canvas><div class="needle"></div></div>
    <div class="chips"><button class="chip" data-u="1">₹1 / tick</button><button class="chip on" data-u="10">₹10 / tick</button><button class="chip" data-u="100">₹100 / tick</button></div>`;
  const cv = c.stage.querySelector('canvas'), g = cv.getContext('2d');
  let u = 10, v = 0, vel = 0, down = false, lx = 0, lt = 0, raf = 0;
  const PX = 15;
  const size = () => { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; g.setTransform(d, 0, 0, d, 0, 0); draw(); };
  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight; g.clearRect(0, 0, w, h);
    const half = w / 2 / PX, i0 = Math.floor(v / u - half) - 1, i1 = Math.ceil(v / u + half) + 1;
    g.textAlign = 'center'; g.font = '700 12px ui-rounded, system-ui';
    for (let i = i0; i <= i1; i++) {
      if (i < 0) continue;
      const x = w / 2 + (i - v / u) * PX, major = i % 10 === 0, mid = i % 5 === 0;
      g.strokeStyle = major ? '#fff' : 'rgba(255,255,255,.45)'; g.lineWidth = major ? 2.5 : 1.5; g.beginPath();
      g.moveTo(x, h); g.lineTo(x, h - (major ? 56 : mid ? 38 : 24)); g.stroke();
      if (major) { g.fillStyle = 'rgba(255,255,255,.75)'; g.fillText((i * u).toLocaleString('en-IN'), x, h - 66); }
    }
    c.set(Math.round(v / u) * u);
  }
  function loop() {
    if (down) return;
    v = clamp(v + vel / 60, 0, MAX); vel *= 0.94;
    if (v <= 0 || v >= MAX) vel = 0;
    draw();
    if (Math.abs(vel) > u * 0.8) raf = requestAnimationFrame(loop);
    else { const target = Math.round(v / u) * u, from = v, t0 = performance.now(); (function snap(now) { const p = clamp((now - t0) / 140, 0, 1); v = from + (target - from) * p; draw(); if (p < 1) requestAnimationFrame(snap); })(t0); }
  }
  let lastTickIdx = 0;
  cv.onpointerdown = (e) => { cv.setPointerCapture(e.pointerId); down = true; cancelAnimationFrame(raf); vel = 0; lx = e.clientX; lt = performance.now(); };
  cv.onpointermove = (e) => {
    if (!down) return;
    const dx = e.clientX - lx, now = performance.now(), dt = Math.max(1, now - lt); lx = e.clientX; lt = now;
    v = clamp(v - dx / PX * u, 0, MAX); vel = vel * 0.6 + (-dx / PX * u) / dt * 1000 * 0.4; draw();
    const idx = Math.round(v / u); if (idx !== lastTickIdx) { lastTickIdx = idx; buzz(2); }
  };
  cv.onpointerup = cv.onpointercancel = () => { down = false; raf = requestAnimationFrame(loop); };
  c.stage.querySelectorAll('.chip').forEach((b) => b.onclick = () => { c.stage.querySelectorAll('.chip').forEach((x) => x.classList.remove('on')); b.classList.add('on'); u = +b.dataset.u; v = Math.round(v / u) * u; draw(); });
  c.onClear(() => { v = 0; draw(); });
  addEventListener('resize', size); size();
})();

/* ---------- C: spiral ---------- */
(function () {
  const c = card('C', 'Spiral dial', 'Drag your thumb round and round. The dot winds outward along the spiral and every lap is a bigger unit.', 'Lap 1 = ₹1s (up to 100) · lap 2 = ₹10s · lap 3 = ₹100s · lap 4 = ₹1,000s');
  const R0 = 26, GAP = 27, TURNS = 4;
  const pt = (t) => { const a = (t * 360 - 90) * Math.PI / 180, r = R0 + t * GAP; return [Math.cos(a) * r, Math.sin(a) * r]; };
  let path = ''; for (let i = 0; i <= TURNS * 90; i++) { const [x, y] = pt(i / 90); path += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }
  const cols = ['#ffc46b', '#ff9a3c', '#ff6a3d', '#ff3d5a'];
  let laps = ''; for (let l = 0; l < TURNS; l++) { let d = ''; for (let i = 0; i <= 90; i++) { const [x, y] = pt(l + i / 90); d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); } laps += `<path d="${d}" fill="none" stroke="${cols[l]}" stroke-opacity=".28" stroke-width="12" stroke-linecap="round"/>`; }
  c.stage.innerHTML = `<div class="spiralwrap"><svg viewBox="-140 -140 280 280" width="280" height="280"><circle r="138" fill="rgba(0,0,0,.28)" stroke="var(--line)"/>${laps}<path d="${path}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-dasharray="2 5"/><path class="prog" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><circle class="dot" r="13" fill="var(--a)" stroke="#fff" stroke-width="3"/></svg>
    <div class="kcenter"><div><small class="lap">Lap 1 · ₹1s</small></div></div></div>`;
  const w = c.stage.querySelector('.spiralwrap'), dot = w.querySelector('.dot'), prog = w.querySelector('.prog'), lapEl = w.querySelector('.lap');
  const BASE = [0, 100, 1000, 10000], SPAN = [100, 900, 9000, 89999], STEP = [1, 10, 100, 1000], NAMES = ['₹1s', '₹10s', '₹100s', '₹1,000s'];
  const val = (t) => { const lap = Math.min(TURNS - 1, Math.floor(t)), f = t - lap; return Math.round(BASE[lap] + Math.round(f * SPAN[lap] / STEP[lap]) * STEP[lap]); };
  const inv = (v) => { let lap = v >= 10000 ? 3 : v >= 1000 ? 2 : v >= 100 ? 1 : 0; return lap + (v - BASE[lap]) / SPAN[lap]; };
  let t = 0, last = null, lastLap = 0;
  const pol = (e) => { const r = w.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI; };
  function draw() {
    const [x, y] = pt(t); dot.setAttribute('cx', x); dot.setAttribute('cy', y);
    let d = ''; const n = Math.max(1, Math.round(t * 90)); for (let i = 0; i <= n; i++) { const [px, py] = pt(Math.min(t, i / 90)); d += (i ? 'L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1); } prog.setAttribute('d', d);
    const lap = Math.min(TURNS - 1, Math.floor(t)); lapEl.textContent = `Lap ${lap + 1} · ${NAMES[lap]}`;
    if (lap !== lastLap) { lastLap = lap; buzz([10, 30, 10]); }
    c.set(val(t));
  }
  w.onpointerdown = (e) => { w.setPointerCapture(e.pointerId); last = pol(e); };
  w.onpointermove = (e) => { if (last === null) return; const a = pol(e); t = clamp(t + wrapA(a - last) / 360 / 1, 0, TURNS - 0.001); last = a; draw(); };
  w.onpointerup = w.onpointercancel = () => { last = null; };
  c.onClear(() => { t = 0; draw(); }); draw();
})();

/* ---------- D: pour jar ---------- */
(function () {
  const c = card('D', 'Pour jar', 'Press and hold the jar and coins pour in. The longer you hold, the faster it goes. Let go to stop.', 'Hold to pour · tap −10 / −100 to trim');
  c.stage.innerHTML = `<div style="display:grid;gap:10px;justify-items:center"><div class="jar"><div class="fill"></div><div class="lab"><div class="rate">hold me</div></div></div>
    <div class="chips"><button class="chip" data-d="-10">−10</button><button class="chip" data-d="-100">−100</button><button class="chip" data-d="10">+10</button><button class="chip" data-d="100">+100</button></div></div>`;
  const jar = c.stage.querySelector('.jar'), fill = jar.querySelector('.fill'), rateEl = jar.querySelector('.rate');
  let holding = false, t0 = 0, last = 0, f = 0, raf = 0, coinT = 0;
  const level = () => Math.min(1, Math.log10(1 + c.get()) / 4.7);
  const upd = () => { fill.style.height = level() * 100 + '%'; };
  function loop(now) {
    if (!holding) return;
    const dt = (now - last) / 1000; last = now; const held = (now - t0) / 1000;
    const rate = Math.min(4000, 12 * Math.pow(2, held * 1.7));
    f += rate * dt;
    const q = rate > 400 ? 50 : rate > 120 ? 10 : 1;
    c.set(Math.round(f / q) * q); upd(); rateEl.textContent = '+' + Math.round(rate) + '/s';
    coinT += dt * Math.min(30, 3 + rate / 40); while (coinT >= 1) { coinT--; const k = document.createElement('div'); k.className = 'coin'; k.style.left = 10 + Math.random() * 140 + 'px'; jar.appendChild(k); setTimeout(() => k.remove(), 750); }
    if (Math.floor(held * 12) !== Math.floor((held - dt) * 12)) buzz(2);
    raf = requestAnimationFrame(loop);
  }
  jar.onpointerdown = (e) => { jar.setPointerCapture(e.pointerId); holding = true; f = c.get(); t0 = last = performance.now(); raf = requestAnimationFrame(loop); };
  jar.onpointerup = jar.onpointercancel = () => { holding = false; cancelAnimationFrame(raf); rateEl.textContent = 'hold me'; buzz(12); };
  c.stage.querySelectorAll('.chip').forEach((b) => b.onclick = () => { c.set(c.get() + +b.dataset.d); upd(); buzz(6); });
  c.onClear(() => { f = 0; upd(); }); upd();
})();

/* ---------- E: cash notes ---------- */
(function () {
  const c = card('E', 'Cash notes', 'Tap the notes you spent, like counting cash. Tap a chip in the pile to take one back.', 'Tap a note to add · tap a pile chip to remove one');
  const D = [[10, '#c9f0a7'], [20, '#ffd3a3'], [50, '#a7e3ff'], [100, '#d3b8ff'], [200, '#ffe27a'], [500, '#a8f0d0'], [1000, '#ffb3c1'], [2000, '#f6a6ff']];
  c.stage.style.alignContent = 'start'; c.stage.style.minHeight = '230px';
  c.stage.innerHTML = `<div style="width:100%"><div class="notes"></div><div class="pile"></div></div>`;
  const notes = c.stage.querySelector('.notes'), pile = c.stage.querySelector('.pile'), count = {};
  const render = () => { pile.innerHTML = D.filter(([d]) => count[d]).map(([d]) => `<button class="chip on" data-d="${d}">₹${d} × ${count[d]}</button>`).join('') || '<span class="hint">No notes yet</span>'; pile.querySelectorAll('button').forEach((b) => b.onclick = () => { const d = +b.dataset.d; count[d]--; c.set(c.get() - d); buzz(8); render(); }); };
  D.forEach(([d, col]) => { const b = document.createElement('button'); b.className = 'note'; b.style.background = col; b.textContent = d; b.onclick = () => { count[d] = (count[d] || 0) + 1; c.set(c.get() + d); buzz(8); render(); }; notes.appendChild(b); });
  c.onClear(() => { for (const k in count) delete count[k]; render(); }); render();
})();

/* ---------- F: scrub slider with fine control ---------- */
(function () {
  const c = card('F', 'Scrub slider', 'Slide across a big bar. The scale grows with distance so ₹5 and ₹5,000 are both reachable. Slide your finger upward to slow down for precision.', 'Drag up while sliding = fine control (like scrubbing a video)');
  c.stage.style.minHeight = '150px';
  c.stage.innerHTML = `<div style="width:100%"><div class="fine">&nbsp;</div><div class="scrub"><div class="bar"></div><div class="thumb"></div><div class="ticks"><span>₹0</span><span>₹100</span><span>₹1k</span><span>₹10k</span><span>₹50k</span></div></div></div>`;
  const s = c.stage.querySelector('.scrub'), bar = s.querySelector('.bar'), th = s.querySelector('.thumb'), fineEl = c.stage.querySelector('.fine');
  const TOP = 4.7; let p = 0, lx = 0, sy = 0, down = false;
  const toVal = (p) => { const raw = Math.pow(10, p * TOP) - 1; const step = raw >= 5000 ? 100 : raw >= 1000 ? 50 : raw >= 100 ? 10 : raw >= 20 ? 5 : 1; return Math.round(raw / step) * step; };
  const show = () => { bar.style.width = th.style.left = p * 100 + '%'; c.set(toVal(p)); };
  s.onpointerdown = (e) => { s.setPointerCapture(e.pointerId); down = true; lx = e.clientX; sy = e.clientY; if (e.target === s || e.target === bar) { const r = s.getBoundingClientRect(); p = clamp((e.clientX - r.left) / r.width, 0, 1); show(); } };
  s.onpointermove = (e) => {
    if (!down) return;
    const up = Math.max(0, sy - e.clientY), f = 1 / (1 + up / 35), r = s.getBoundingClientRect();
    p = clamp(p + (e.clientX - lx) / r.width * f, 0, 1); lx = e.clientX;
    fineEl.innerHTML = f < 0.85 ? `Fine control ×${f.toFixed(2)}` : '&nbsp;'; show();
  };
  s.onpointerup = s.onpointercancel = () => { down = false; fineEl.innerHTML = '&nbsp;'; buzz(8); };
  c.onClear(() => { p = 0; show(); }); show();
})();
</script>
</body>
